<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بث مباشر - شاشة كاملة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;

      background-color: #000000;

      width: 100vw;

      height: 100%;
      border: 0;

</head>
<body>

  <div class="video-container">
    <iframe 
      src="https://m3u8player.app/ar/embed/player/?video_url=https%253A%252F%252F43869de4e1a0d641.servers.dvcloud.tv%252Fhls%252Fal_aqsa_channel%252F6udfi7v8a3eof6nlps6e9ovfrs65c7l7.m3u8&amp;autoplay=true&amp;type=m3u8" 
      title="Embedded M3U8 (HLS) player" 
      loading="lazy" 
      allowfullscreen="true" 
      webkitallowfullscreen="true" 
      mozallowfullscreen="true" 
      allow="fullscreen; autoplay; picture-in-picture; encrypted-media">
    </iframe>
  </div>

</body>
</html>
