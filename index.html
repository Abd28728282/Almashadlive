<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HLS Player</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  html, body { width: 100%; height: 100%; background: #000; }
  #player { width: 100%; height: 100%; }
  #playBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75); color: #fff;
    border: 2px solid #fff; padding: 18px 40px;
    border-radius: 50px; font-size: 20px; cursor: pointer;
    z-index: 9999; font-family: sans-serif;
  }
  #playBtn:hover { background: rgba(255,0,0,0.8); }
</style>
</head>
<body>
<div id="player"></div>
<button id="playBtn">▶ تشغيل</button>

<script src="https://ssl.p.jwpcdn.com/player/v/8.17.7/jwplayer.js"></script>
<script>
  jwplayer.key = "oXqNrzSZ9lQbo5mgdmfM+TwMP/GR4bAiKFXy8nlANTs=";

  const player = jwplayer("player").setup({
    file: "https://43869de4e1a0d641.servers.dvcloud.tv/hls/al_aqsa_channel/6udfi7v8a3eof6nlps6e9ovfrs65c7l7.m3u8",
    width: "100%",
    height: "100%",
    stretching: "exactfit",
    autostart: false,          // لا يشتغل إلا بالزر
    mute: false,               // الصوت مفتوح
    primary: "html5",
    hlshtml: true,
    androidhls: true,
    allowfullscreen: true,
    controls: true
  });

  // ضغطة واحدة = تشغيل + صوت
  document.getElementById('playBtn').addEventListener('click', function () {
    player.setMute(false);
    player.setVolume(100);
    player.play();
    this.style.display = 'none';   // إخفاء الزر بعد التشغيل
  });
</script>
</body>
</html>
