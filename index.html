<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HLS Player</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  html, body { width: 100%; height: 100%; background: #000; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>

<script src="https://ssl.p.jwpcdn.com/player/v/8.17.7/jwplayer.js"></script>
<script>
  jwplayer.key = "oXqNrzSZ9lQbo5mgdmfM+TwMP/GR4bAiKFXy8nlANTs=";

  const player = jwplayer("player").setup({
    file: "https://43869de4e1a0d641.servers.dvcloud.tv/hls/al_aqsa_channel/6udfi7v8a3eof6nlps6e9ovfrs65c7l7.m3u8",
    width: "100%",
    height: "100%",
    stretching: "exactfit",
    autostart: true,          // تشغيل تلقائي
    mute: false,              // الصوت مفتوح من البداية
    primary: "html5",
    hlshtml: true,
    androidhls: true,
    allowfullscreen: true,
    controls: true
  });

  // محاولة إضافية لضمان التشغيل والصوت (احتياط)
  player.on('ready', function () {
    player.setMute(false);
    player.setVolume(100);
    player.play();
  });
</script>
</body>
</html>
